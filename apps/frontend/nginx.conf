server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are client-side routes handled by react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted assets emitted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
